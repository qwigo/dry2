<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRY2.css Button Component Test</title>
    <link rel="stylesheet" href="src/dry2/css/dry2.css">
    <style>
        body {
            padding: 1rem;
        }
        h1 {
            margin: 0 0 1rem 0;
        }
        p {
            margin: 0 0 1rem 0;
        }
    </style>
</head>
<body>
    <h1>DRY2.css Button Component Test</h1>
    <p>
        <button class="btn btn-primary" type="button">Primary Button</button>
        <button class="btn" type="button">Secondary Button</button>
        <button class="btn btn-outline" type="button">Outline Button</button>
        <button class="btn btn-ghost" type="button">Text Button</button>
        <button class="btn btn-primary" type="button" disabled>Disabled Button</button>
    </p>
    <p>
        <button class="btn btn-sm" type="button">Small Button</button>
        <button class="btn" type="button">Medium Button</button>
        <button class="btn btn-lg" type="button">Large Button</button>
    </p>
</body>
</html>
